name: PyPI

# Builds and publishes python/langchain-pdffr with PyPI trusted publishing (no tokens).
# One-time setup on pypi.org: project "langchain-pdffr" → Publishing → add this repo,
# workflow "pypi.yml", environment "pypi".

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python/langchain-pdffr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/langchain-pdffr/dist
